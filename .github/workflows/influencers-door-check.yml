name: Influencers Door checks
on:
  push:
    branches:
      - feat/influencers-door-r0-3
  pull_request:
    branches:
      - genesis
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and contract transitions
        run: npm run check
      - name: Verify lifecycle and permission checks
        run: npm test
      - name: Run synthetic and gateway conformance tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Confirm build contents
        run: |
          test -f dist/index.html
          test -f dist/src/influencers.js
          test -f dist/src/influencers.test.js
